<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeckoPlotter · starting</title>
<link rel="icon" href="/icon.png">
<style>
  :root { --bg:#1d1d1f; --ink:#e8eaec; --muted:#8d949b; --line:#2e3034; --green:#7cc79a; --green-hi:#9be3b4; --orange:#f0913a; --red:#ef6b6b; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:860px; margin:0 auto; padding:40px 24px 32px; }
  header { display:flex; align-items:center; gap:12px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  header img { width:40px; height:40px; }
  header h1 { margin:0; font-size:22px; font-weight:650; letter-spacing:-.01em; }
  header span { color:var(--muted); font-size:14px; }
  .screen { padding-top:22px; font:13px/1.55 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace; }
  canvas { display:block; width:100%; height:auto; margin:0 auto 14px; }
  .prompt { color:var(--muted); } .prompt b { color:var(--green); font-weight:normal; }
  .line { white-space:pre; overflow:hidden; text-overflow:ellipsis; }
  .ok { color:var(--green); } .run { color:var(--orange); } .todo { color:#5d6369; } .err { color:var(--red); }
  .bar { color:var(--green); margin:8px 0 6px; white-space:pre; }
  .log { color:#6f767d; min-height:5.5em; margin-top:6px; }
  .log .line::before { content:"  │ "; color:#454a50; }
  .done { color:var(--green-hi); }
  .note { margin:22px 0 0; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  @media (max-width:600px) { main { padding:24px 16px; } .screen { font-size:11.5px; } }
</style>
<main>
  <header><img src="/icon.png" alt="" onerror="this.style.display='none'"><h1>GeckoPlotter</h1><span>starting on this computer</span></header>
  <div class="screen">
    <canvas id="art" width="784" height="360" aria-label="An ASCII gecko walking over a chromatogram while GeckoPlotter starts"></canvas>
    <div class="line prompt">$ <b>geckoplotter</b> start</div>
    <div id="steps"></div>
    <div class="bar" id="bar"></div>
    <div class="log" id="log"></div>
  </div>
  <p class="note" id="note">First start only: GeckoPlotter installs everything it needs (about 600 MB, a few minutes). After that it starts in seconds and updates itself from GitHub. It runs on this computer, so your data stays here.</p>
</main>
<script>
(() => {
  // ---------------------------------------------------------------- ASCII gecko + chromatogram
  const COLS = 98, ROWS = 24, CW = 8, CH = 15;           // character grid and cell size in canvas pixels
  const GECKO_ROWS = 17;                                   // rows for the gecko; the rest is the chromatogram
  const RAMP = ' .:-=+*#%@';
  const canvas = document.getElementById('art'), ctx = canvas.getContext('2d');
  canvas.width = COLS * CW; canvas.height = ROWS * CH;
  const SX = 2, SY = 4;                                    // raster pixels per character (cells are ~2x taller than wide)
  const off = document.createElement('canvas'); off.width = COLS * SX; off.height = GECKO_ROWS * SY;
  const o = off.getContext('2d', { willReadFrequently: true });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let progress = 0, shown = 0, failed = false;

  function spine(t) {                                      // head on the right, walking right; 152 x 64 drawing space
    const pts = [], N = 90;
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const x = 132 - s * 112;
      const y = 32 + Math.sin(s * 4.6 - t * 4.0) * (1.2 + 8 * s * s) + Math.sin(s * 9 - t * 3) * 1.0 * s;
      let r;
      if (s < 0.035) r = 3.0 + s * 90;
      else if (s < 0.105) r = 6.2;
      else if (s < 0.17) r = 4.6 + (0.17 - s) * 22;
      else if (s < 0.62) r = 8.4 - Math.abs(s - 0.40) * 6;
      else r = Math.max(0.8, 6.6 * Math.pow(Math.max(0, 1 - (s - 0.62) / 0.38), 0.8));
      pts.push({ x, y, r });
    }
    return pts;
  }

  function limb(base, side, phase, front) {
    const swing = Math.cos(phase), lift = Math.max(0, Math.sin(phase));
    const joint = { x: base.x + (front ? -4 : 4) + swing * 2, y: base.y + side * 12.5 };
    const foot = { x: joint.x + (front ? 8 : -8) + swing * 5, y: joint.y + side * (5 - lift * 2) };
    o.lineCap = o.lineJoin = 'round';
    o.lineWidth = 3.8; o.beginPath(); o.moveTo(base.x, base.y + side * 4); o.lineTo(joint.x, joint.y); o.stroke();
    o.lineWidth = 3.0; o.beginPath(); o.moveTo(joint.x, joint.y); o.lineTo(foot.x, foot.y); o.stroke();
    const fx = front ? 1 : -1, fy = side * 0.55, n = Math.hypot(fx, fy);
    o.lineWidth = 1.8;
    for (const a of [-0.9, 0, 0.9]) {
      const dx = (fx * Math.cos(a) - fy * Math.sin(a)) / n, dy = (fx * Math.sin(a) + fy * Math.cos(a)) / n;
      o.beginPath(); o.moveTo(foot.x, foot.y); o.lineTo(foot.x + dx * 5, foot.y + dy * 5); o.stroke();
    }
  }

  function drawGecko(t) {
    const k = off.width / 146;
    o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, off.width, off.height);
    o.setTransform(k, 0, 0, k, 0, (off.height - 64 * k) / 2);
    o.fillStyle = o.strokeStyle = '#fff';
    const pts = spine(t);
    for (const p of pts) { o.beginPath(); o.arc(p.x, p.y, p.r, 0, 7); o.fill(); }
    const at = s => pts[Math.round(s * (pts.length - 1))];
    const ph = t * 4.0;
    limb(at(0.22), -1, ph, true);  limb(at(0.22), 1, ph + Math.PI, true);
    limb(at(0.55), 1, ph, false);  limb(at(0.55), -1, ph + Math.PI, false);
    o.globalCompositeOperation = 'destination-out';
    const h = at(0.07); o.beginPath(); o.arc(h.x - 0.3, h.y - 3.6, 1.7, 0, 7); o.arc(h.x - 0.3, h.y + 3.6, 1.7, 0, 7); o.fill();
    o.globalCompositeOperation = 'source-over';
  }

  const lerp = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const HI = [155, 227, 180], MID = [79, 154, 109], LO = [53, 95, 73], OFF = [62, 66, 71], ORANGE = [240, 145, 58];
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const PEAKS = [[0.30, 0.25, 0.022], [0.55, 1.0, 0.018], [0.66, 0.55, 0.016], [0.82, 0.38, 0.02]]; // position, height, width
  const BLOCKS = ' ▁▂▃▄▅▆▇█';

  function frame(ms) {
    const t = still ? 0.5 : ms / 1000;
    shown += (progress - shown) * (still ? 0.35 : 0.05);
    drawGecko(t);
    const data = o.getImageData(0, 0, off.width, off.height).data;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${CH - 2}px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace`;
    ctx.textBaseline = 'top';
    for (let row = 0; row < GECKO_ROWS; row++) for (let col = 0; col < COLS; col++) {
      let sum = 0;
      for (let y = 0; y < SY; y++) for (let x = 0; x < SX; x++) sum += data[((row * SY + y) * off.width + col * SX + x) * 4 + 3];
      const cover = sum / (255 * SX * SY);
      if (cover < 0.08) continue;
      const ch = RAMP[Math.min(RAMP.length - 1, Math.round(cover * (RAMP.length - 1)))];
      const f = col / COLS;                              // fills left to right, tail to head, like a progress bar
      const lit = !failed && f <= shown + 0.02;
      const shade = lit ? (f < .5 ? lerp(LO, MID, f / .5) : lerp(MID, HI, (f - .5) / .5)) : OFF;
      ctx.fillStyle = rgb(shade);
      ctx.fillText(ch, col * CW, row * CH);
    }
    // chromatogram under the gecko: the peaks rise as the start progresses
    const chromRows = ROWS - GECKO_ROWS - 1, base = ROWS - 1;
    for (let col = 0; col < COLS; col++) {
      const u = col / (COLS - 1);
      let level = 0;
      for (const [p, h, w] of PEAKS) level += h * Math.exp(-(((u - p) / w) ** 2));
      const height = Math.min(1, level) * chromRows * Math.min(1, shown * 1.15) * 8;   // in eighths of a row
      ctx.fillStyle = failed ? rgb(OFF) : rgb(ORANGE);
      for (let r = 0; r < chromRows; r++) {
        const fill = Math.max(0, Math.min(8, height - r * 8));
        if (fill > 0.5) ctx.fillText(BLOCKS[Math.round(fill)], col * CW, (base - 1 - r) * CH);
      }
      ctx.fillStyle = failed ? rgb(OFF) : 'rgba(240,145,58,.55)';
      ctx.fillText('─', col * CW, base * CH);
    }
    // Reduced motion (Windows "Animation effects" off): the gecko holds still, but the fill and the peaks still
    // follow the progress, so redraw a few times a second instead of stopping.
    if (still) setTimeout(() => frame(performance.now()), 250); else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- status from the launcher
  const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
  let spin = 0;
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  async function poll() {
    let st;
    try { st = await (await fetch('/status', { cache: 'no-store' })).json(); }
    catch (e) { document.getElementById('log').innerHTML = '<div class="line err">The launcher window was closed. Start GeckoPlotter again.</div>'; return; }
    spin = (spin + 1) % SPIN.length;
    document.getElementById('steps').innerHTML = st.steps.map(s => {
      const mark = s.state === 'done' ? '<span class="ok">[✓]</span>' : s.state === 'skip' ? '<span class="ok">[–]</span>'
        : s.state === 'active' ? `<span class="run">[${SPIN[spin]}]</span>` : '<span class="todo">[ ]</span>';
      const note = s.state === 'skip' ? ' <span class="todo">already done</span>' : '';
      return `<div class="line">${mark} ${esc(s.label)}${note}</div>`;
    }).join('');
    progress = st.progress;
    const width = 40, filled = Math.round(st.progress * width);
    document.getElementById('bar').textContent = '[' + '█'.repeat(filled) + '░'.repeat(width - filled) + '] ' + Math.round(st.progress * 100) + '%';
    document.getElementById('log').innerHTML = (st.lines || []).map(l => `<div class="line">${esc(l)}</div>`).join('');
    if (st.error) {
      failed = true;
      document.getElementById('log').innerHTML += `<div class="line err">✗ ${esc(st.error)}</div><div class="line">send this file to Glenn: ${esc(st.log)}</div>`;
      document.getElementById('note').textContent = 'Close the launcher window and start GeckoPlotter again. If it keeps happening, send the file named above.';
      return;
    }
    if (st.url) {
      progress = 1;
      document.getElementById('log').innerHTML += `<div class="line done">✓ ready · version ${esc(st.version || '')} · opening your workspace…</div>`;
      setTimeout(() => { location.href = st.url; }, 1500);
      return;
    }
    setTimeout(poll, 300);
  }
  poll();
})();
</script>
</html>
