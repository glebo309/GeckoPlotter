name: Tests

# Runs the Python and JavaScript test suites on every push, so a change is checked before it reaches `main`
# (colleagues' launchers pull `main` on every start).
on:
  push:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          uv venv --python 3.12 .test-venv
          uv pip install --python .test-venv/bin/python -r requirements.txt pytest
      - name: Python tests
        env:
          GECKO_AUTOSAVE_DIR: ${{ runner.temp }}/autosave
        run: .test-venv/bin/python -m pytest -q -p no:cacheprovider --ignore=tests/test_launcher.py

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript tests
        run: for f in tests/js/*.test.cjs; do node "$f" || exit 1; done
